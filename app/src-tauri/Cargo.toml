[package]
name = "fenixos"
description = "fenixOS PC app: board link engine, tray and window"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fenix-proto.workspace = true
fenix-link.workspace = true
