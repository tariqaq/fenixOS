[package]
name = "fenixos"
description = "fenixOS PC app: board link engine, tray and window"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fenix-proto.workspace = true
fenix-link.workspace = true
fenix-pkg.workspace = true
fenix-sdk.workspace = true
sha2 = "0.10"
espflash = { version = "=4.6.0", default-features = false, features = ["serialport"] }
serialport = { version = "4.10.1", default-features = false }
ureq = "3"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
