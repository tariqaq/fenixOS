[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "tools/sample-app/pc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tariqaq/fenixOS"

[workspace.dependencies]
fenix-proto = { path = "crates/fenix-proto" }
fenix-link = { path = "crates/fenix-link" }
fenix-pkg = { path = "crates/fenix-pkg" }
fenix-sdk = { path = "crates/fenix-sdk" }

# No cross-crate LTO, parallel codegen: quick rebuilds (P12). Measured with a 4-core cap: fat LTO
# with one codegen unit ~10 min per rebuild (exe 8.1 MB), thin LTO 1 min 31 s (9.14 MB), none
# 45 s (9.13 MB). One profile for every build kind, so the CI caches are shared.
[profile.release]
opt-level = "s"
lto = false
strip = true
panic = "abort"
