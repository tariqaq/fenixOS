[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "tools/sample-app/pc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tariqaq/fenixOS"

[workspace.dependencies]
fenix-proto = { path = "crates/fenix-proto" }
fenix-link = { path = "crates/fenix-link" }
fenix-pkg = { path = "crates/fenix-pkg" }
fenix-sdk = { path = "crates/fenix-sdk" }

# Thin LTO and parallel codegen keep rebuilds quick (P12). Fat LTO with one codegen unit made the
# exe ~1 MB smaller but took ~10 min per rebuild, and a different profile per build kind splits
# the CI caches, so every build uses this one.
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
