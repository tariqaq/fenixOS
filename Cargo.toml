[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "tools/sample-app/pc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tariqaq/fenixOS"

[workspace.dependencies]
fenix-proto = { path = "crates/fenix-proto" }
fenix-link = { path = "crates/fenix-link" }
fenix-pkg = { path = "crates/fenix-pkg" }
fenix-sdk = { path = "crates/fenix-sdk" }

# Thin LTO and parallel codegen keep rebuilds quick (P12); a tag build in release.yml switches to
# fat LTO with one codegen unit for the smallest shipped binary.
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
