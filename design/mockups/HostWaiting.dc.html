<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host app, waiting for PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;font-optical-sizing:auto;color:#FFFFFF;background:#000000}
button{font-family:inherit}
button:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 640px; height: 480px; background: #000000; overflow: hidden">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; display: flex; flex-direction: column">
<div style="height: 32px; flex: 0 0 32px; position: relative; display: flex; align-items: center; padding: 0 8px">
<button type="button" style="height: 32px; border: 0; background: transparent; color: #0A84FF; padding: 0 4px; display: flex; align-items: center; gap: 2px; font-size: 15px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 256 256" fill="#0A84FF"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg>
<span>Home</span>
</button>
<p style="margin: 0; position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 600; pointer-events: none">Stream Deck</p>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 24px 16px 24px; text-align: center">
<svg role="img" aria-label="Waiting" width="22" height="22" viewBox="0 0 22 22">
<g stroke="#FF9F0A" stroke-width="2" stroke-linecap="round">
<line x1="11" y1="2.5" x2="11" y2="6.5" opacity="1"></line>
<line x1="17" y1="5" x2="14.2" y2="7.8" opacity="0.85"></line>
<line x1="19.5" y1="11" x2="15.5" y2="11" opacity="0.7"></line>
<line x1="17" y1="17" x2="14.2" y2="14.2" opacity="0.55"></line>
<line x1="11" y1="19.5" x2="11" y2="15.5" opacity="0.45"></line>
<line x1="5" y1="17" x2="7.8" y2="14.2" opacity="0.35"></line>
<line x1="2.5" y1="11" x2="6.5" y2="11" opacity="0.28"></line>
<line x1="5" y1="5" x2="7.8" y2="7.8" opacity="0.2"></line>
</g>
</svg>
<p style="margin: 8px 0 0 0; font-size: 17px; font-weight: 600">Waiting for host PC</p>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #98989F">Stream Deck runs with your PC. Open fenixOS on the PC and connect the board by USB.</p>
</div>
</div>
</div>
</x-dc>

    return {};
  }

</script>
</body>
</html>
