<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session pop-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;font-optical-sizing:auto;color:#FFFFFF;background:#000000}
button{font-family:inherit}
button:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 640px; height: 480px; background: #000000; overflow: hidden; position: relative">
<dc-import name="HomeA" hint-size="640px,480px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>
<div style="position: absolute; left: 0; top: 0; width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-labelledby="sesstitle" style="background: #1C1C1E; border-radius: 14px 14px 0 0; padding: 12px 12px 10px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<p id="sesstitle" style="margin: 0; font-size: 17px; font-weight: 600">Session</p>
<p style="margin: 0; font-size: 12px; color: #98989F">Shut down sleeps the board. Tap the screen to wake it.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 40px; border: 0; border-radius: 20px; background: #C9302C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 256 256" fill="#FFFFFF"><path d="M128,24A104,104,0,1,0,232,128,104,104,0,0,0,128,24Zm-8,40a8,8,0,0,1,16,0v64a8,8,0,0,1-16,0Zm8,144A80,80,0,0,1,83.55,61.48a8,8,0,1,1,8.9,13.29,64,64,0,1,0,71.1,0,8,8,0,1,1,8.9-13.29A80,80,0,0,1,128,208Z"></path></svg>
<span>Shut down</span>
</button>
<button type="button" style="height: 40px; border: 0; border-radius: 20px; background: #2C2C2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 256 256" fill="#FFFFFF"><path d="M244,56v48a12,12,0,0,1-12,12H184a12,12,0,1,1,0-24H201.1l-19-17.38c-.13-.12-.26-.24-.38-.37A76,76,0,1,0,127,204h1a75.53,75.53,0,0,0,52.15-20.72,12,12,0,0,1,16.49,17.45A99.45,99.45,0,0,1,128,228h-1.37A100,100,0,1,1,198.51,57.06L220,76.72V56a12,12,0,0,1,24,0Z"></path></svg>
<span>Reboot</span>
</button>
</div>
<button type="button" style="height: 32px; border: 0; background: transparent; color: #0A84FF; font-size: 15px; font-weight: 600">Cancel</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
