[package]
name = "fenix-link"
description = "fenixOS board discovery, handshake, heartbeat, reconnect and stream canvas over USB serial"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fenix-proto.workspace = true
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# SetCommTimeouts on the port handle (`no_wait_reads`); the version serialport already uses.
windows-sys = { version = "0.52", features = ["Win32_Devices_Communication", "Win32_Foundation"] }
