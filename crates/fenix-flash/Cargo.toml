[package]
name = "fenix-flash"
description = "fenixOS board firmware flasher (espflash), shared by the PC app and the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
espflash = { version = "=4.6.0", default-features = false, features = ["serialport"] }
serialport = { version = "4.10.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
