name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/version.py --check
      - run: python tools/gen_tokens.py --check
      - run: python tools/registry.py --check

  board:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # ccache keeps compiled objects between runs (LVGL and LovyanGFX are most of the build). The
      # key changes every run so the cache is saved each time; the newest one is restored.
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-idf-v5.5.5-${{ github.run_id }}
          restore-keys: ccache-idf-v5.5.5-
      - name: build
        shell: bash
        env:
          IDF_CCACHE_ENABLE: 1
          CCACHE_MAXSIZE: 500M
        run: |
          export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE
          . $IDF_PATH/export.sh
          cd board
          idf.py build
          idf.py size
          ccache -s
      # The simulator's LVGL options must match this build's Kconfig values.
      - run: python3 tools/sim_config.py --check

  # Board screens from the PC simulator (board/sim), compared with board/sim/golden.
  sim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The cache key skips the release profile, and a full key match is never saved again: hash
      # .cargo/config.toml (the profile) so a profile change starts a new cache, a version bump not.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.cargo/config.toml') }}
      - run: python tools/sim_shots.py
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sim-shots
          path: board/sim/build/shots

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # tools/licenses.py reads LovyanGFX's library.json
      - uses: dtolnay/rust-toolchain@stable
      # The cache key skips the release profile, and a full key match is never saved again: hash
      # .cargo/config.toml (the profile) so a profile change starts a new cache, a version bump not.
      # Shared key "app": release.yml's app job restores this main-branch cache (a tag's own cache
      # is readable only by that tag).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app
          key: ${{ hashFiles('.cargo/config.toml') }}
      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # tauri-build needs the built UI (app/dist) before the app crate compiles.
      - name: ui
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-check
          pnpm build
      - run: python tools/licenses.py --check
      - run: cargo test --workspace
      # The release build the release workflow makes (tauri build, release profile), so the cache
      # above holds its crates and a release tag builds warm. Main only: PR caches stay in the PR.
      - if: github.ref == 'refs/heads/main'
        run: pnpm -C app tauri build --no-bundle
