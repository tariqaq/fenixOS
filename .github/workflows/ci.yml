name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/version.py --check
      - run: python tools/gen_tokens.py --check
      - run: python tools/registry.py --check

  board:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd board
          idf.py build
          idf.py size

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # tauri-build needs the built UI (app/dist) before the app crate compiles.
      - name: ui
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-check
          pnpm build
      - run: cargo test --workspace
