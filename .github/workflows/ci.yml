name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/version.py --check
      - run: python tools/gen_tokens.py --check
      - run: python tools/registry.py --check

  board:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd board
          idf.py build
          idf.py size
      # The simulator's LVGL options must match this build's Kconfig values.
      - run: python3 tools/sim_config.py --check

  # Board screens from the PC simulator (board/sim), compared with board/sim/golden.
  sim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python tools/sim_shots.py
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sim-shots
          path: board/sim/build/shots

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # tools/licenses.py reads LovyanGFX's library.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # tauri-build needs the built UI (app/dist) before the app crate compiles.
      - name: ui
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-check
          pnpm build
      - run: python tools/licenses.py --check
      - run: cargo test --workspace
